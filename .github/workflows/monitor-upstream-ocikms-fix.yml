name: Monitorar correção upstream do OCI KMS

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar merge e tag estável upstream
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = { owner: 'hashicorp', repo: 'go-kms-wrapping' };
            const issueNumber = 324;
            const fixPath = 'wrappers/ocikms/ocikms.go';
            const markerLabel = 'upstream-ocikms-monitor';

            const decodeContent = (data) =>
              Buffer.from(data.content.replace(/\n/g, ''), data.encoding).toString('utf8');

            const containsFix = (source) => {
              const requestMetadataIndex = source.indexOf('func (k *Wrapper) getRequestMetadata()');
              if (requestMetadataIndex < 0) return false;

              const retrySection = source.slice(
                Math.max(0, requestMetadataIndex - 2000),
                requestMetadataIndex + 2000,
              );
              const hasNilResponseGuard =
                /\.Response\s*==\s*nil/.test(retrySection) ||
                /\.Response\s*!=\s*nil/.test(retrySection) ||
                /\.Response\?\./.test(retrySection);

              return hasNilResponseGuard;
            };

            const { data: issue } = await github.rest.issues.get({
              ...upstream,
              issue_number: issueNumber,
            });
            core.info(`Monitorando a issue #${issueNumber}: ${issue.html_url}`);

            const timeline = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              { ...upstream, issue_number: issueNumber, per_page: 100 },
            );
            const associatedPullNumbers = [...new Set(
              timeline
                .filter((event) =>
                  event.event === 'cross-referenced' &&
                  event.source?.issue?.pull_request &&
                  event.source.issue.repository?.full_name === `${upstream.owner}/${upstream.repo}`
                )
                .map((event) => event.source.issue.number),
            )];

            const associatedPulls = [];
            for (const pullNumber of associatedPullNumbers) {
              try {
                const { data: pull } = await github.rest.pulls.get({
                  ...upstream,
                  pull_number: pullNumber,
                });
                associatedPulls.push(pull);
                core.info(
                  `PR #${pull.number}: state=${pull.state}, merged=${Boolean(pull.merged_at)} (${pull.html_url})`,
                );
              } catch (error) {
                if (error.status !== 404) throw error;
                core.warning(`A PR associada #${pullNumber} não existe mais.`);
              }
            }

            const { data: defaultBranchFile } = await github.rest.repos.getContent({
              ...upstream,
              path: fixPath,
            });
            const fixIsOnDefaultBranch =
              !Array.isArray(defaultBranchFile) && containsFix(decodeContent(defaultBranchFile));
            const mergedPulls = associatedPulls.filter((pull) => pull.merged_at);

            if (mergedPulls.length === 0 && !fixIsOnDefaultBranch) {
              core.info(
                `A issue #${issueNumber} ainda não possui PR associada merged e o guard ainda não está no código upstream.`,
              );
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              ...upstream,
              per_page: 100,
            });
            const stableTags = tags.filter((tag) =>
              /^wrappers\/ocikms\/v2\.\d+\.\d+$/.test(tag.name)
            );

            let publishedTag;
            for (const tag of stableTags) {
              const { data: taggedFile } = await github.rest.repos.getContent({
                ...upstream,
                path: fixPath,
                ref: tag.name,
              });
              if (!Array.isArray(taggedFile) && containsFix(decodeContent(taggedFile))) {
                publishedTag = tag.name;
                break;
              }
            }

            if (!publishedTag) {
              core.info('O código pode ter sido merged, mas ainda não existe uma tag estável do ocikms que contenha a correção.');
              return;
            }

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: markerLabel,
              per_page: 100,
            });
            if (existingIssues.length > 0) {
              core.info(`A notificação já foi criada na issue #${existingIssues[0].number}.`);
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: markerLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: markerLabel,
                color: '0E8A16',
                description: 'Notificações automáticas sobre a correção upstream do OCI KMS',
              });
            }

            const { data: notificationIssue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Correção upstream do OCI KMS disponível',
              labels: [markerLabel],
              body: [
                'Olá! A correção que evita o panic de resposta nula no OCI KMS já está disponível upstream.',
                '',
                `- Issue: ${issue.html_url}`,
                ...associatedPulls.map((pull) =>
                  `- PR associada: ${pull.html_url} (${pull.merged_at ? 'merged' : pull.state})`
                ),
                `- Tag estável: \`${publishedTag}\``,
                '',
                'Podemos agora remover o override temporário `devopshouse/go-kms-wrapping`, atualizar a dependência do Vault para a tag upstream e executar novamente a suíte de testes e o rollout controlado.',
              ].join('\n'),
            });
            core.notice(`Notificação em português criada: ${notificationIssue.html_url}`);
